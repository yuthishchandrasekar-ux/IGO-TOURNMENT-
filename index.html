<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Action - Multi-Team</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.4); }
    .pulse-bid { animation: pulseBid 0.5s ease-out; }
    @keyframes pulseBid { 0% { transform: scale(1); } 50% { transform: scale(1.1); color: #fff; text-shadow: 0 0 20px #22c55e; } 100% { transform: scale(1); } }
    .stamp { font-size: 4rem; font-weight: 900; color: #dc2626; border: 8px solid #dc2626; padding: 0.5rem 2rem; border-radius: 1rem; transform: rotate(-15deg); opacity: 0.8; letter-spacing: 4px; pointer-events: none;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect } = React;
const socket = io();

const formatMoney = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);

function App() {
  const [role, setRole] = useState(null); // 'admin', 'captain', 'spectator'
  const [teamId, setTeamId] = useState(null);
  
  const [players, setPlayers] = useState([]);
  const [state, setState] = useState(null);
  
  useEffect(() => {
    socket.on('sync_state', (data) => {
      setState(data.state);
      setPlayers(data.players);
    });
    
    socket.on('timer_tick', (t) => {
      setState(s => s ? { ...s, currentAuction: { ...s.currentAuction, timeLeft: t } } : s);
    });

    socket.on('timer_ended', () => {
      setState(s => s ? { ...s, currentAuction: { ...s.currentAuction, timerActive: false, timeLeft: 0 } } : s);
    });

    return () => {
      socket.off('sync_state');
      socket.off('timer_tick');
      socket.off('timer_ended');
    };
  }, []);

  if (!role) {
    return <LoginScreen setRole={setRole} setTeamId={setTeamId} captains={state?.captains || []} />;
  }

  if (!state) return <div className="p-8 text-center text-xl">Connecting to Auction Server...</div>;

  if (state.stage === 'SETUP') {
    if (role === 'admin') return <AdminSetup state={state} players={players} />;
    return (
      <div className="min-h-screen flex items-center justify-center text-center p-8">
        <div>
          <h1 className="text-5xl font-bold neon-text mb-4">AUCTION IS STARTING SOON</h1>
          <p className="text-xl text-slate-400">Waiting for the auctioneer to configure the settings and start the live event...</p>
        </div>
      </div>
    );
  }

  // Live Screen
  return <LiveScreen role={role} teamId={teamId} state={state} players={players} />;
}

function LoginScreen({ setRole, setTeamId, captains }) {
  const [view, setView] = useState('select'); // select, admin, captain
  const [selectedCap, setSelectedCap] = useState('');
  const [pass, setPass] = useState('');
  const [error, setError] = useState('');

  const handleLogin = (e) => {
    e.preventDefault();
    socket.emit('login', { role: view, teamId: selectedCap, password: pass }, (res) => {
      if (res.success) {
        setRole(res.role);
        if(res.role === 'captain') setTeamId(res.teamId);
      } else {
        setError(res.message);
      }
    });
  };

  if (view === 'select') {
    return (
      <div className="min-h-screen flex items-center justify-center fade-in bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black">
        <div className="bg-slate-900/80 p-10 rounded-3xl shadow-2xl border border-slate-700/50 backdrop-blur-xl w-full max-w-md text-center">
          <h1 className="text-4xl font-bold mb-8 neon-text">CHOOSE ROLE</h1>
          <div className="space-y-4">
            <button onClick={() => { setRole('spectator'); socket.emit('login', {role: 'spectator'}, ()=>{}); }} className="w-full bg-slate-800 hover:bg-slate-700 p-4 rounded-xl font-bold text-xl transition">
              👀 Watch Live
            </button>
            <button onClick={() => setView('captain')} className="w-full bg-blue-600/20 text-blue-400 border border-blue-500/50 hover:bg-blue-600/30 p-4 rounded-xl font-bold text-xl transition">
              👑 Team Captain Login
            </button>
            <button onClick={() => setView('admin')} className="w-full bg-red-600/20 text-red-400 border border-red-500/50 hover:bg-red-600/30 p-4 rounded-xl font-bold text-xl transition">
              🎙️ Auctioneer Login
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex items-center justify-center fade-in">
      <form onSubmit={handleLogin} className="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <button type="button" onClick={() => setView('select')} className="text-slate-400 mb-4 hover:text-white">← Back</button>
        <h2 className="text-3xl font-bold mb-6">{view === 'admin' ? 'Auctioneer Login' : 'Captain Login'}</h2>
        
        {view === 'captain' && (
          <select className="w-full mb-4 bg-slate-900 border border-slate-700 rounded-lg p-3" value={selectedCap} onChange={e => setSelectedCap(e.target.value)} required>
            <option value="">Select Team</option>
            {captains.map(c => <option key={c.id} value={c.id}>{c.teamName} ({c.name})</option>)}
          </select>
        )}
        
        <input 
          type="password" placeholder="Password" required
          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mb-4"
          value={pass} onChange={e => setPass(e.target.value)}
        />
        
        {error && <div className="text-red-500 mb-4">{error}</div>}
        
        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold text-lg">Login</button>
      </form>
    </div>
  );
}

function AdminSetup({ state, players }) {
  const handleStart = () => {
    socket.emit('admin_start_auction');
  };

  return (
    <div className="min-h-screen p-8 text-center flex flex-col items-center justify-center">
       <h1 className="text-4xl font-bold mb-8">Auctioneer Setup</h1>
       <p className="mb-8 text-slate-400">Players ready: {players.length}</p>
       <p className="mb-8 text-xl text-yellow-400">Passwords for Captains: <br/> C1: <b>p1</b>, C2: <b>p2</b>, C3: <b>p3</b>, C4: <b>p4</b></p>
       <button onClick={handleStart} className="bg-red-600 px-8 py-4 rounded-xl font-bold text-2xl hover:bg-red-500 shadow-[0_0_30px_rgba(220,38,38,0.5)]">START AUCTION LIVE</button>
    </div>
  );
}

function LiveScreen({ role, teamId, state, players }) {
  const { currentAuction, captains, history } = state;
  const p = currentAuction.currentPlayerId ? players.find(x => x.id === currentAuction.currentPlayerId) : null;
  const highestTeam = currentAuction.highestBidderId ? captains.find(c => c.id === currentAuction.highestBidderId) : null;

  // Pulse effect on bid
  const [pulse, setPulse] = useState(false);
  useEffect(() => {
    if (currentAuction.currentBid > 0) {
      setPulse(true);
      setTimeout(() => setPulse(false), 500);
    }
  }, [currentAuction.currentBid]);

  return (
    <div className="min-h-screen flex flex-col fade-in relative">
      
      {/* HEADER */}
      <header className="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center z-10">
        <div className="font-bold text-2xl neon-text tracking-widest uppercase">
          {role === 'admin' ? '🎙️ AUCTIONEER PANEL' : role === 'captain' ? '👑 CAPTAIN CONSOLE' : '📺 LIVE SPECTATOR'}
        </div>
        
        {role === 'captain' && (
          <div className="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 flex gap-4 text-sm font-bold">
            <div>TEAM: <span className="text-blue-400">{captains.find(c=>c.id === teamId)?.teamName}</span></div>
            <div>PURSE: <span className="text-green-400">{formatMoney(captains.find(c=>c.id === teamId)?.purse)}</span></div>
          </div>
        )}
      </header>

      <div className="flex-1 flex overflow-hidden">
        
        {/* LEFT: History Sidebar */}
        <div className="w-1/4 bg-slate-900/50 border-r border-slate-800 flex flex-col">
          <div className="p-4 font-bold border-b border-slate-800 tracking-widest text-slate-400">RECENT SALES</div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
             {history.slice().reverse().map((h, i) => {
               const player = players.find(pl => pl.id === h.playerId);
               const team = captains.find(c => c.id === h.teamId);
               return (
                 <div key={i} className="bg-slate-800/80 p-3 rounded-lg border border-slate-700">
                    <div className="font-bold text-lg truncate">{player?.name}</div>
                    {h.type === 'SOLD' ? (
                      <div className="flex justify-between text-sm mt-1">
                        <span className="text-blue-400">{team?.teamName}</span>
                        <span className="text-green-400 font-bold">{formatMoney(h.amount)}</span>
                      </div>
                    ) : (
                      <div className="text-red-500 font-bold text-sm mt-1">UNSOLD</div>
                    )}
                 </div>
               );
             })}
          </div>
        </div>

        {/* CENTER: Main Auction Block */}
        <div className="flex-1 flex flex-col p-8 items-center justify-center relative overflow-hidden bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black">
          
          {p ? (
            <div className="w-full max-w-4xl relative">
              {/* Player Card */}
              <div className="bg-gradient-to-b from-slate-800 to-slate-900 rounded-3xl p-10 border border-slate-700 shadow-2xl relative">
                 <div className="absolute top-0 right-10 bg-red-600 text-white px-6 py-2 rounded-b-xl font-bold shadow-lg">
                    BASE: {formatMoney(p.basePrice)}
                 </div>
                 
                 <div className="text-slate-400 font-bold mb-2 uppercase tracking-widest">ON THE BLOCK</div>
                 <h1 className="text-6xl font-black mb-8 leading-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">{p.name || 'Unknown'}</h1>
                 
                 <div className="flex gap-8 text-xl">
                   <div className="bg-slate-900 px-6 py-3 rounded-xl border border-slate-700 shadow-inner">
                     <span className="text-slate-500 block text-sm mb-1 uppercase">Department</span>
                     <span className="font-bold">{p.department}</span>
                   </div>
                   <div className="bg-slate-900 px-6 py-3 rounded-xl border border-slate-700 shadow-inner">
                     <span className="text-slate-500 block text-sm mb-1 uppercase">Role</span>
                     <span className="font-bold text-yellow-400">{p.contribution}</span>
                   </div>
                 </div>
                 
                 {p.status === 'SOLD' && (
                    <div className="absolute inset-0 flex items-center justify-center z-20">
                      <div className="stamp border-red-500 text-red-500 shadow-[0_0_50px_rgba(220,38,38,0.5)] bg-black/40 backdrop-blur-sm">SOLD!</div>
                    </div>
                 )}
                 {p.status === 'UNSOLD' && (
                    <div className="absolute inset-0 flex items-center justify-center z-20">
                      <div className="stamp border-slate-500 text-slate-500 bg-black/40 backdrop-blur-sm">UNSOLD</div>
                    </div>
                 )}
              </div>

              {/* Bid Status */}
              <div className="mt-8 bg-slate-900 rounded-3xl p-8 border-2 border-blue-900/50 flex items-center justify-between shadow-[0_0_50px_rgba(30,58,138,0.2)]">
                <div>
                  <div className="text-slate-400 font-bold tracking-widest mb-2 uppercase">Current Bid</div>
                  <div className={`text-6xl font-black text-green-400 font-mono transition-transform ${pulse ? 'pulse-bid' : ''}`}>
                    {formatMoney(currentAuction.currentBid)}
                  </div>
                </div>
                
                <div className="text-center">
                  <div className="text-slate-400 font-bold tracking-widest mb-2 uppercase">Highest Bidder</div>
                  <div className="text-3xl font-bold bg-slate-800 px-6 py-3 rounded-xl border border-slate-700">
                    {highestTeam ? highestTeam.teamName : 'None'}
                  </div>
                </div>

                <div className="text-center">
                  <div className="text-slate-400 font-bold tracking-widest mb-2 uppercase">Timer</div>
                  <div className={`text-7xl font-black font-mono transition-colors ${currentAuction.timeLeft <= 5 && currentAuction.timeLeft > 0 ? 'text-red-500 animate-pulse' : 'text-slate-200'}`}>
                    {currentAuction.timeLeft}
                  </div>
                </div>
              </div>

              {/* Controls */}
              <div className="mt-8 flex justify-center gap-4">
                
                {role === 'captain' && p.status === 'AVAILABLE' && (
                  <button 
                    onClick={() => socket.emit('captain_bid', teamId)}
                    disabled={currentAuction.highestBidderId === teamId || !currentAuction.timerActive}
                    className="bg-green-600 hover:bg-green-500 disabled:opacity-50 disabled:cursor-not-allowed w-full max-w-md py-6 rounded-2xl font-bold text-3xl transition shadow-[0_0_20px_rgba(34,197,94,0.3)] transform hover:scale-105 active:scale-95"
                  >
                    PLACE BID (+{formatMoney(state.settings.bidIncrement)})
                  </button>
                )}
                
                {role === 'admin' && p.status === 'AVAILABLE' && (
                  <div className="flex gap-4 w-full">
                     {!currentAuction.timerActive ? (
                       <button onClick={() => socket.emit('admin_start_timer')} className="flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold text-xl">START TIMER</button>
                     ) : (
                       <button disabled className="flex-1 bg-slate-700 py-4 rounded-xl font-bold text-xl opacity-50">TIMER TICKING...</button>
                     )}
                     <button onClick={() => socket.emit('admin_sold')} disabled={!highestTeam} className="flex-1 bg-green-600 hover:bg-green-500 disabled:opacity-50 py-4 rounded-xl font-bold text-xl">SELL</button>
                     <button onClick={() => socket.emit('admin_unsold')} className="flex-1 bg-red-600 hover:bg-red-500 py-4 rounded-xl font-bold text-xl">UNSOLD</button>
                  </div>
                )}
                
              </div>
            </div>
          ) : (
            <div className="text-center w-full">
              <h2 className="text-4xl font-bold text-slate-500 mb-8">Waiting for next player...</h2>
              {role === 'admin' && (
                 <div className="max-w-2xl mx-auto text-left bg-slate-900 p-6 rounded-xl border border-slate-700 max-h-96 overflow-y-auto custom-scrollbar">
                   <h3 className="font-bold mb-4 border-b border-slate-700 pb-2">Select Next Player:</h3>
                   {players.filter(p => p.status === 'AVAILABLE').map(pl => (
                     <button key={pl.id} onClick={() => socket.emit('admin_next_player', pl.id)} className="w-full text-left p-3 hover:bg-slate-800 border-b border-slate-800 flex justify-between transition">
                       <span className="font-bold">{pl.name}</span>
                       <span className="text-slate-500">{pl.department}</span>
                     </button>
                   ))}
                 </div>
              )}
            </div>
          )}

        </div>

        {/* RIGHT: Team Purses */}
        <div className="w-1/5 bg-slate-900/50 border-l border-slate-800 flex flex-col p-4 space-y-4">
           <div className="font-bold border-b border-slate-800 tracking-widest text-slate-400 pb-2">LEADERBOARD</div>
           {captains.map(c => (
             <div key={c.id} className="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
               <div className="font-bold text-lg mb-1">{c.teamName}</div>
               <div className="text-sm text-slate-400 mb-3">{c.name}</div>
               
               <div className="w-full bg-slate-900 h-2 rounded-full mb-2 overflow-hidden">
                 <div className="bg-green-500 h-full transition-all" style={{width: `${(c.purse / 200000) * 100}%`}}></div>
               </div>
               
               <div className="flex justify-between font-bold">
                 <span className="text-slate-500">Purse</span>
                 <span className={c.purse < 50000 ? 'text-red-400' : 'text-green-400'}>{formatMoney(c.purse)}</span>
               </div>
               <div className="flex justify-between text-sm mt-1 font-bold">
                 <span className="text-slate-500">Squad</span>
                 <span>{players.filter(p => p.teamId === c.id).length}</span>
               </div>
             </div>
           ))}
        </div>

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
